    <link rel="stylesheet" type="text/css" href="index.css" />

<body>
    <!-- This paints a vivid, almost mathematical autobiography—like someone tried to turn a human life into a spreadsheet. -->
    <div class='music'>
        <button class='music' onclick="window.open('https://voicians.bandcamp.com/album/impro-piano-i')">Play some music in the background</button>
    </div>
    <div id="instruction">
        <div class="hidden firstline">Climax</div>
    </div>
    <div class="center">
        <table id="top">
            <tr>
                <td class="hidden" id="timetext"></td>
                <td class="hidden" id="timechart"></td>
            </tr>
        </table>
    </div>
    <div class="center">
        <table id="bottom">
            <tr>
                <td class="hidden" id="cashtext"></td>
                <td class="hidden" id="cashchart"></td>
            </tr>
        </table>
    </div>

    <script src="js-3rd-party/p5.min.js"></script>
